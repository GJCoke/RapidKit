global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: rapidkit-process
    file_sd_configs:
      - files: [/etc/prometheus/discovery/targets.json]
        refresh_interval: 10s
  - job_name: rapidkit-ops
    static_configs:
      - targets: [observability:9009]
  - job_name: rapidkit-host
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
