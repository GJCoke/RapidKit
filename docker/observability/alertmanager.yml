global:
  resolve_timeout: 1m
route:
  receiver: operations
  group_by: [alertname, service, component, instance]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 12h
receivers:
  - name: operations
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 50
