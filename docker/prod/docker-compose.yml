name: rapidkit-prod

services:
  # ==================== Infrastructure ====================

  postgresql:
    image: ${REGISTRY_PREFIX:-}bitnami/postgresql
    container_name: rapidkit-prod-postgresql
    env_file: .env.prod
    volumes:
      - prod-pg-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d client" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: ${REGISTRY_PREFIX:-}redis:7-alpine
    container_name: rapidkit-prod-redis
    env_file: .env.prod
    command: [ "sh", "-c", "redis-server --requirepass $$REDIS_ROOT_PASSWORD" ]
    volumes:
      - prod-redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_ROOT_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: rapidkit-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ../..
      dockerfile: docker/minio/Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
    container_name: rapidkit-prod-minio
    env_file: .env.prod
    command: server /data --console-address ":9001"
    volumes:
      - prod-minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Backend ====================

  backend-api:
    image: rapidkit-backend:prod
    build: &backend-build
      context: ../..
      dockerfile: docker/backend/Dockerfile
      target: prod
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:latest}
    container_name: rapidkit-prod-backend-api
    stop_grace_period: 45s
    env_file: .env.prod
    environment:
      CELERY_WORKER_NAMES: '["${CELERY_WORKER_NAME:-celery@rapidkit-prod-celery-worker}"]'
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/ready', timeout=3).read()" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend-migrate:
    image: rapidkit-backend:prod
    build: *backend-build
    command: ["sh", "scripts/alembic/migrate.sh"]
    env_file: .env.prod
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  celery-worker:
    image: rapidkit-backend:prod
    build: *backend-build
    container_name: rapidkit-prod-celery-worker
    command: ["celery", "-A", "src.queues.app", "worker", "-l", "info", "--hostname", "${CELERY_WORKER_NAME:-celery@rapidkit-prod-celery-worker}"]
    env_file: .env.prod
    environment:
      CELERY_WORKER_NAMES: '["${CELERY_WORKER_NAME:-celery@rapidkit-prod-celery-worker}"]'
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: rapidkit-backend:prod
    build: *backend-build
    container_name: rapidkit-prod-celery-beat
    command: celery -A src.queues.app beat -S src.queues.scheduler:AsyncDatabaseScheduler -l info
    env_file: .env.prod
    environment:
      CELERY_WORKER_NAMES: '["${CELERY_WORKER_NAME:-celery@rapidkit-prod-celery-worker}"]'
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==================== Frontend + Nginx ====================

  nginx:
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: rapidkit-prod-nginx
    ports:
      - "18080:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prod-pg-data:
  prod-redis-data:
  prod-minio-data:

networks:
  default:
    name: rapidkit-prod-network
