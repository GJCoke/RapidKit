name: rapidkit-prod

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    mode: non-blocking
    max-buffer-size: "1m"

x-backend-environment: &backend-environment
  RAPIDKIT_BASE_PATH: /app
  RUNTIME_STATE_DIR: /tmp/rapidkit-runtime
  LOG_JSON: ${LOG_JSON:-true}
  LOG_FILE_BUDGET_BYTES: ${LOG_FILE_BUDGET_BYTES:-5368709120}
  LOG_FILE_MIN_FREE_BYTES: ${LOG_FILE_MIN_FREE_BYTES:-67108864}

services:
  # ==================== Infrastructure ====================

  postgresql:
    logging: *runtime-logging
    image: ${REGISTRY_PREFIX:-}bitnami/postgresql
    container_name: rapidkit-prod-postgresql
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    volumes:
      - prod-pg-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d client" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    logging: *runtime-logging
    image: ${REGISTRY_PREFIX:-}redis:7-alpine
    container_name: rapidkit-prod-redis
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    command: [ "sh", "-c", "redis-server --requirepass $$REDIS_ROOT_PASSWORD --appendonly yes --appendfsync everysec" ]
    volumes:
      - prod-redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_ROOT_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    logging: *runtime-logging
    image: rapidkit-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ../..
      dockerfile: docker/minio/Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
    container_name: rapidkit-prod-minio
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    command: server /data --console-address ":9001"
    volumes:
      - prod-minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Backend ====================

  backend-api:
    logging: *runtime-logging
    volumes:
      - type: bind
        source: ${RAPIDKIT_LOG_ROOT:-/var/lib/rapidkit/logs}/api
        target: /app/logs
        bind:
          create_host_path: false
    environment:
      <<: *backend-environment
      RAPIDKIT_SERVICE_ROLE: api
      PROMETHEUS_MULTIPROC_DIR: /tmp/rapidkit-prometheus
    image: rapidkit-backend:prod
    build: &backend-build
      context: ../..
      dockerfile: docker/backend/Dockerfile
      target: prod
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.5}
    stop_grace_period: 45s
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/ready', timeout=3).read()" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend-migrate:
    logging: *runtime-logging
    environment:
      <<: *backend-environment
      RAPIDKIT_SERVICE_ROLE: migrate
    volumes:
      - type: bind
        source: ${RAPIDKIT_LOG_ROOT:-/var/lib/rapidkit/logs}/migrate
        target: /app/logs
        bind:
          create_host_path: false
    image: rapidkit-backend:prod
    build: *backend-build
    command: ["sh", "scripts/alembic/migrate.sh"]
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  celery-worker:
    logging: *runtime-logging
    volumes:
      - type: bind
        source: ${RAPIDKIT_LOG_ROOT:-/var/lib/rapidkit/logs}/worker
        target: /app/logs
        bind:
          create_host_path: false
    image: rapidkit-backend:prod
    build: *backend-build
    command: ["python", "-m", "plugin_worker.launcher"]
    environment:
      <<: *backend-environment
      RAPIDKIT_SERVICE_ROLE: worker
      CELERY_WORKER_GROUP: ${CELERY_WORKER_GROUP:-prod/default}
      CELERY_WORKER_DEPLOYMENT: ${CELERY_WORKER_DEPLOYMENT:-}
    deploy:
      replicas: ${CELERY_WORKER_REPLICAS:-1}
    stop_grace_period: 120s
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    logging: *runtime-logging
    environment:
      <<: *backend-environment
      RAPIDKIT_SERVICE_ROLE: beat
    volumes:
      - type: bind
        source: ${RAPIDKIT_LOG_ROOT:-/var/lib/rapidkit/logs}/beat
        target: /app/logs
        bind:
          create_host_path: false
    image: rapidkit-backend:prod
    build: *backend-build
    container_name: rapidkit-prod-celery-beat
    command: celery -A src.queues.app beat -S src.queues.scheduler:AsyncDatabaseScheduler -l info
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  observability:
    image: rapidkit-backend:prod
    build: *backend-build
    container_name: rapidkit-prod-observability
    command: ["python", "-m", "src.ops.exporter"]
    logging: *runtime-logging
    env_file: ${RAPIDKIT_ENV_FILE:-.env.prod}
    environment:
      RAPIDKIT_BASE_PATH: /app
      OBSERVABILITY_LOG_ROOT: /logs
      OBSERVABILITY_INVENTORY: /inventory/inventory.json
      LOG_FILE_BUDGET_BYTES: ${LOG_FILE_BUDGET_BYTES:-5368709120}
    volumes:
      - ${RAPIDKIT_LOG_ROOT:-/var/lib/rapidkit/logs}:/logs:ro
      - ${RAPIDKIT_OBSERVABILITY_ROOT:-/var/lib/rapidkit/observability}:/inventory:ro
    depends_on:
      postgresql:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9009/metrics',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Frontend + Nginx ====================

  nginx:
    logging: *runtime-logging
    environment:
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: rapidkit-prod-nginx
    ports:
      - "18080:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prod-pg-data:
  prod-redis-data:
  prod-minio-data:

networks:
  default:
    name: rapidkit-prod-network
    ipam:
      config:
        - subnet: 172.30.0.0/24
