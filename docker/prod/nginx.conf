worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map "$https:${SECURITY_HSTS_ENABLED}" $security_hsts {
        default "";
        ~*^on:(true|1)$ "max-age=31536000";
    }

    # Browsers send preferred languages first; skip unsupported language tags.
    map $http_accept_language $body_limit_message {
        default "请求体过大";
        "~*^(?:(?!\s*(?:zh|en)(?:-|;|,|$))[^,]*,)*\s*en(?:-|;|,|$)" "Request body is too large";
    }

    server {
        listen 80;
        server_name _;
        set $backend backend-api:8006;
        client_max_body_size ${MAX_REQUEST_BODY_BYTES};
        include /etc/nginx/security-headers.conf;
        error_page 413 =200 @request_body_too_large;

        location @request_body_too_large {
            default_type application/json;
            return 200 '{"code":1007,"message":"$body_limit_message","data":null}';
        }

        location = /health { return 404; }
        location ^~ /health/ { return 404; }
        location = /metrics { return 404; }
        location ^~ /metrics/ { return 404; }

        # ---------- Frontend static files ----------
        root /usr/share/nginx/html;
        index index.html;

        # SPA history mode fallback
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        }

        # Long cache for hashed assets (Vite adds content hash to filenames)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        }

        # ---------- Backend API reverse proxy ----------
        location /api/ {
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_pass http://$backend$request_uri;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for long-running API calls
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---------- Socket.IO WebSocket proxy ----------
        location /socket.io/ {
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket connections can be long-lived
            proxy_read_timeout 86400s;
        }

        # ---------- MinIO proxy ----------
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # MinIO needs large uploads
            client_max_body_size 100m;
        }
    }
}
