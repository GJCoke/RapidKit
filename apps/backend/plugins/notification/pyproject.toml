[project]
name = "rapidkit-plugin-notification"
version = "0.1.0"
description = "RapidKit 通用通知系统（站内渠道核心）"
requires-python = ">=3.14"
dependencies = [
    "rapidkit-core",
    "rapidkit-common",
    "rapidkit-framework",
]

[project.entry-points."rapidkit.plugins"]
notification = "plugin_notification:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_notification"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
