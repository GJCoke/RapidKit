[project]
name = "rapidkit-plugin-system"
version = "0.1.0"
description = "RapidKit system dashboard plugin"
requires-python = ">=3.14"
dependencies = [
    "rapidkit-core",
    "rapidkit-common",
    "minio>=7.2.18,<8.0",
    "psutil>=7.0.0,<8.0",
    "urllib3>=2.6.0,<3.0",
]

[project.entry-points."rapidkit.plugins"]
system = "plugin_system:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_system"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
